<div class="stories">{% for s in stories %}{% if s.img %}
<button class="story" data-full="{{ s.full }}" data-title="{{ s.title }}" data-link="{{ s.link }}"><div class="ring"><img src="{{ s.img }}" alt="" loading="lazy" draggable="false"></div>{{ s.title }}</button>
{% endif %}{% endfor %}</div>
<div class="sviewer" id="sviewer"><button class="x">{{ ic('x') }}</button><div class="box"><div class="bar"><i></i></div><img alt=""><div class="cap"></div></div></div>
