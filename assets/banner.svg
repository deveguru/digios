    <path d="M100 0 V360 M250 0 V360 M400 0 V360 M550 0 V360 M700 0 V360 M850 0 V360 M1000 0 V360 M1150 0 V360"/>
  </g>
  <!-- windows of the "OS" -->
  <g transform="translate(90 92)">
    <rect width="250" height="176" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect width="250" height="34" rx="18" fill="url(#brand)"/>
    <circle cx="22" cy="17" r="5" fill="#fff" opacity=".9"/><circle cx="40" cy="17" r="5" fill="#fff" opacity=".6"/><circle cx="58" cy="17" r="5" fill="#fff" opacity=".35"/>
    <rect x="18" y="52" width="66" height="66" rx="12" fill="#fff" fill-opacity=".16"/>
    <rect x="94" y="52" width="66" height="66" rx="12" fill="#fff" fill-opacity=".16"/>
    <rect x="170" y="52" width="62" height="66" rx="12" fill="#fff" fill-opacity=".16"/>
    <rect x="18" y="132" width="214" height="12" rx="6" fill="#fff" fill-opacity=".22"/>
    <rect x="18" y="152" width="140" height="10" rx="5" fill="#fff" fill-opacity=".14"/>
    <path d="M40 98 l12 -14 l10 9 l14 -20 l12 25" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 70 h34 l-4 30 h-26 z M118 70 a9 9 0 0 1 18 0" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="201" cy="85" r="18" fill="none" stroke="#ef4056" stroke-width="5" stroke-dasharray="70 120"/>
  </g>
  <text x="1110" y="150" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="78" font-weight="900" fill="#ffffff">Digi OS</text>
  <text x="1110" y="210" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="34" font-weight="800" fill="url(#brand)" direction="rtl">سیستم‌عامل فروشگاهی تحت وب</text>
  <text x="1110" y="258" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" fill="#e9e5ff" opacity="0.85" direction="rtl">فروشگاه · پنل مدیریت · داشبورد مادر · هوش مصنوعی لمورا</text>
  <g transform="translate(1110 290)" font-family="Tahoma, sans-serif" font-size="14" fill="#fff">
    <rect x="-330" y="0" width="100" height="30" rx="15" fill="#ffffff" fill-opacity=".12"/><text x="-280" y="20" text-anchor="middle">RTL · فارسی</text>
    <rect x="-220" y="0" width="100" height="30" rx="15" fill="#ffffff" fill-opacity=".12"/><text x="-170" y="20" text-anchor="middle">Dark / Light</text>
    <rect x="-110" y="0" width="110" height="30" rx="15" fill="url(#brand)"/><text x="-55" y="20" text-anchor="middle">Responsive</text>
