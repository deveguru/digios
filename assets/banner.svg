<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="0.55" stop-color="#2a1458"/>
      <stop offset="1" stop-color="#3b0d2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4056"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#ef4056" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ef4056" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <circle cx="170" cy="300" r="120" fill="#6366f1" opacity="0.25" filter="url(#soft)"/>
  <g opacity="0.12" stroke="#fff" stroke-width="1">
